<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="900" viewBox="0 0 1000 900" role="img" aria-label="Multiple Codex links, one shared project workspace">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#536782" stroke-width="1.5"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#203049} .title{font-size:30px;font-weight:700} .sub{font-size:18px;fill:#536782} .label{font-size:22px;font-weight:700} .detail{font-size:18px} .line{fill:none;stroke:#536782;stroke-width:2.5;marker-end:url(#arrow)} </style>
<rect width="100%" height="100%" fill="#f6f8fc"/>
<text x="40" y="48" class="title">Multiple Codex links, one shared project workspace</text>
<text x="40" y="79" class="sub">Requested target — current v2 private workspaces do not provide this yet.</text>
<rect x="290" y="107" width="420" height="62" rx="14" fill="#e3edff" stroke="#9bacc4" stroke-width="2"/>
<text x="500.0" y="138" text-anchor="middle" class="label">Tom selects a remote computer</text>
<rect x="60" y="213" width="415" height="63" rx="14" fill="#ffffff" stroke="#9bacc4" stroke-width="2" stroke-dasharray="7 5"/>
<text x="267.5" y="244" text-anchor="middle" class="label">Codex remote link A</text>
<rect x="525" y="213" width="415" height="63" rx="14" fill="#ffffff" stroke="#9bacc4" stroke-width="2" stroke-dasharray="7 5"/>
<text x="732.5" y="244" text-anchor="middle" class="label">Codex remote link B</text>
<path d="M400 169 V190 H267 V213" class="line"/>
<path d="M600 169 V190 H733 V213" class="line"/>
<rect x="60" y="319" width="415" height="143" rx="14" fill="#ffffff" stroke="#9bacc4" stroke-width="2" stroke-dasharray="7 5"/>
<text x="267.5" y="350" text-anchor="middle" class="label">Pod / logical host A</text>
<text x="267.5" y="378" text-anchor="middle" class="detail">Its own enrollment + daemon state</text>
<text x="267.5" y="403" text-anchor="middle" class="detail">Its own private agent home</text>
<text x="267.5" y="428" text-anchor="middle" class="detail">Stable link survives pod replacement</text>
<rect x="525" y="319" width="415" height="143" rx="14" fill="#ffffff" stroke="#9bacc4" stroke-width="2" stroke-dasharray="7 5"/>
<text x="732.5" y="350" text-anchor="middle" class="label">Pod / logical host B</text>
<text x="732.5" y="378" text-anchor="middle" class="detail">Its own enrollment + daemon state</text>
<text x="732.5" y="403" text-anchor="middle" class="detail">Its own private agent home</text>
<text x="732.5" y="428" text-anchor="middle" class="detail">Stable link survives pod replacement</text>
<path d="M267 276 V319" class="line"/>
<path d="M733 276 V319" class="line"/>
<rect x="60" y="529" width="880" height="277" rx="18" fill="#e7f3ec" stroke="#77a98b" stroke-width="2" stroke-dasharray="7 5"/>
<text x="500" y="563" text-anchor="middle" class="label">Same shared filesystem paths in every participating pod</text>
<path d="M267 462 V493 H367 V529" class="line"/>
<path d="M733 462 V493 H633 V529" class="line"/>
<rect x="95" y="584" width="810" height="66" rx="14" fill="#ffffff" stroke="#9bacc4" stroke-width="2" stroke-dasharray="7 5"/>
<text x="500.0" y="615" text-anchor="middle" class="label">~/codex/project — stable roots + shared project rules</text>
<rect x="95" y="673" width="330" height="96" rx="14" fill="#ffffff" stroke="#9bacc4" stroke-width="2" stroke-dasharray="7 5"/>
<text x="260.0" y="704" text-anchor="middle" class="label">~/repos/repo</text>
<text x="260.0" y="732" text-anchor="middle" class="detail">Verified reference clone</text>
<text x="260.0" y="757" text-anchor="middle" class="detail">Fetch + pin before new task</text>
<rect x="455" y="673" width="450" height="96" rx="14" fill="#ffffff" stroke="#9bacc4" stroke-width="2" stroke-dasharray="7 5"/>
<text x="680.0" y="704" text-anchor="middle" class="label">~/work/task-a and task-b</text>
<text x="680.0" y="732" text-anchor="middle" class="detail">One worktree / branch owner per task</text>
<text x="680.0" y="757" text-anchor="middle" class="detail">Resume preserves files and Git state</text>
<path d="M425 721 H455" class="line"/>
<text x="500" y="846" text-anchor="middle" class="detail">Project files are shared. Enrollment, sockets and rotating login ownership are separate.</text>
<text x="500" y="877" text-anchor="middle" class="sub">Storage, cross-pod locking, rules loading and two-host pairing require acceptance tests.</text>
</svg>
