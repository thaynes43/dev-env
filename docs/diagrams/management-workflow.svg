<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="860" viewBox="0 0 1000 860" role="img" aria-label="How you request and manage work">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#536782" stroke-width="1.5"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#203049} .title{font-size:30px;font-weight:700} .sub{font-size:18px;fill:#536782} .label{font-size:22px;font-weight:700} .detail{font-size:18px} .line{fill:none;stroke:#536782;stroke-width:2.5;marker-end:url(#arrow)} </style>
<rect width="100%" height="100%" fill="#f6f8fc"/>
<text x="40" y="48" class="title">How you request and manage work</text>
<text x="40" y="79" class="sub">The orchestrator is an API/controller. A coordinator agent is a client.</text>
<rect x="300" y="107" width="400" height="62" rx="14" fill="#e3edff" stroke="#9bacc4" stroke-width="2"/>
<text x="500.0" y="138" text-anchor="middle" class="label">Tom: phone / desktop / terminal</text>
<rect x="60" y="209" width="415" height="91" rx="14" fill="#ffffff" stroke="#9bacc4" stroke-width="2"/>
<text x="267.5" y="240" text-anchor="middle" class="label">Claude Code or Codex app</text>
<text x="267.5" y="268" text-anchor="middle" class="detail">Talk to a coordinator agent</text>
<rect x="525" y="209" width="415" height="91" rx="14" fill="#ffffff" stroke="#9bacc4" stroke-width="2" stroke-dasharray="7 5"/>
<text x="732.5" y="240" text-anchor="middle" class="label">CLI today / console planned</text>
<text x="732.5" y="268" text-anchor="middle" class="detail">A management client can call the API</text>
<path d="M400 169 V188 H267 V209" class="line"/>
<path d="M600 169 V188 H733 V209" class="line"/>
<rect x="60" y="341" width="415" height="91" rx="14" fill="#ffffff" stroke="#9bacc4" stroke-width="2"/>
<text x="267.5" y="372" text-anchor="middle" class="label">Coordinator agent</text>
<text x="267.5" y="400" text-anchor="middle" class="detail">Understands your request; sends it</text>
<path d="M267 300 V341" class="line"/>
<rect x="235" y="475" width="530" height="91" rx="14" fill="#e3edff" stroke="#9bacc4" stroke-width="2"/>
<text x="500.0" y="506" text-anchor="middle" class="label">Operator API + controller — built</text>
<text x="500.0" y="534" text-anchor="middle" class="detail">Creates sessions; reports lifecycle and status</text>
<path d="M267 432 V454 H400 V475" class="line"/>
<path d="M733 300 V454 H600 V475" class="line"/>
<rect x="60" y="613" width="415" height="116" rx="14" fill="#ffffff" stroke="#9bacc4" stroke-width="2"/>
<text x="267.5" y="644" text-anchor="middle" class="label">Claude worker session</text>
<text x="267.5" y="672" text-anchor="middle" class="detail">Task / local terminal: working</text>
<text x="267.5" y="697" text-anchor="middle" class="detail">Phone path: unfinished</text>
<rect x="525" y="613" width="415" height="116" rx="14" fill="#ffffff" stroke="#9bacc4" stroke-width="2" stroke-dasharray="7 5"/>
<text x="732.5" y="644" text-anchor="middle" class="label">Codex remote hosts</text>
<text x="732.5" y="672" text-anchor="middle" class="detail">Multiple pod links + shared workspace</text>
<text x="732.5" y="697" text-anchor="middle" class="detail">Owner requirement; not built</text>
<path d="M400 566 V589 H267 V613" class="line"/>
<path d="M600 566 V589 H733 V613" class="line"/>
<text x="500" y="775" text-anchor="middle" class="detail">Status and available links return through the management client.</text>
<text x="500" y="809" text-anchor="middle" class="sub">Day-to-day management surface still needs review. Dashed boxes contain planned behavior.</text>
</svg>
