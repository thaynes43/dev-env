---
# PROPOSAL, not a copy: thaynes43/dev-env DESIGN-042 5.1 (P5, the new VAP). This file is
# NOT in haynes-ops yet. It is what P5 would add as
# kubernetes/main/apps/dev-env-system/rbac/app/grant-secret-names.yaml. The broker's
# envtest suite (namespace_operator_envtest_test.go) proves it on the 1.35 API server.
# When P5 lands, copy the haynes-ops version into ../haynes-ops/ and delete this one.
#
# dev-env-grant-secret-names: a grant identity (dev-agents/grant-<id>) may add a Secret
# reference to a pod spec only for a Secret its own AccessGrant names, in a namespace
# that grant names, while that grant is an Active dev-env-grant-namespace-operator
# grant. It is the second of P5's two guard deltas. The first, in
# dev-env-identity-guard rule 4, lets a grant identity add Secret references at all when
# the authorizer says it holds the custom verb `use` on secrets in the request's
# namespace, and caps activeDeadlineSeconds and ttlSecondsAfterFinished at 3600. Both
# must allow a reference; this policy alone allows nothing.
#
# How it finds the caller's grant. A guard cannot look an object up, so the binding
# takes every AccessGrant in dev-agents as a param (selector {}). The API server
# evaluates the policy once per param and refuses the request if any evaluation fails.
# Each evaluation passes trivially unless the param is the caller's own grant (the
# grant's ServiceAccount is named after it), so only the caller's grant decides.
#   - parameterNotFoundAction Allow: with no grant there is no grant identity.
#   - A grant identity whose AccessGrant is gone matches no param, so this policy allows
#     its references. The identity guard's `use` check still needs the grant's
#     RoleBinding, which the broker deletes with the ServiceAccount, so that identity
#     still holds no `use`.
#   - The cost grows with the number of retained grants (90 days), but only for requests
#     from grant identities. A server dry-run at the retained count is an activation
#     prerequisite (DESIGN-042 5.1).
#
# What counts as a Secret reference, and the short list, are dev-env-identity-guard's
# own definitions, copied: keep them equal. An UPDATE that adds no Secret reference
# (kubectl rollout restart) is not refused here.
#
# failurePolicy Fail: the match condition is a string compare that cannot fail, so an
# error refuses only a grant identity's pod-bearing request.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: dev-env-grant-secret-names
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: dev-env.haynesops.com/v1alpha1
    kind: AccessGrant
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources: [pods, replicationcontrollers]
      - apiGroups: [apps]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources: [deployments, statefulsets, daemonsets, replicasets]
      - apiGroups: [batch]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources: [jobs, cronjobs]
  matchConditions:
    - name: grant-identity
      expression: request.userInfo.username.startsWith('system:serviceaccount:dev-agents:grant-')
  variables:
    # dev-env-identity-guard's short list: keep it equal.
    - name: allowedSecrets
      expression: "['^[a-z0-9-]+/[a-z0-9-]+-volsync-aws-secret$']"
    # The caller's grant: its ServiceAccount's name, after
    # 'system:serviceaccount:dev-agents:' (33 characters).
    - name: grantName
      expression: request.userInfo.username.substring(33)
    - name: resource
      expression: request.resource.resource
    - name: newPod
      expression: >-
        variables.resource == 'pods' ? object.spec :
        variables.resource == 'cronjobs' ? object.spec.jobTemplate.spec.template.spec :
        object.spec.?template.?spec.orValue({})
    - name: oldPod
      expression: >-
        variables.resource == 'pods' ? oldObject.spec :
        variables.resource == 'cronjobs' ? oldObject.spec.jobTemplate.spec.template.spec :
        oldObject.spec.?template.?spec.orValue({})
    - name: newContainers
      expression: >-
        variables.newPod.?containers.orValue([]) + variables.newPod.?initContainers.orValue([]) +
        variables.newPod.?ephemeralContainers.orValue([])
    - name: oldContainers
      expression: >-
        variables.oldPod.?containers.orValue([]) + variables.oldPod.?initContainers.orValue([]) +
        variables.oldPod.?ephemeralContainers.orValue([])
    - name: newSecrets
      expression: >-
        (variables.newPod.?volumes.orValue([]).map(v,
            [v.?secret.?secretName.orValue(''), v.?azureFile.?secretName.orValue(''),
             v.?csi.?nodePublishSecretRef.?name.orValue('')] +
            ['cephfs', 'rbd', 'flexVolume', 'iscsi', 'scaleIO', 'storageos'].map(t,
              v[?t].?secretRef.?name.orValue('')) +
            v.?projected.?sources.orValue([]).map(s, s.?secret.?name.orValue(''))).flatten() +
         variables.newContainers.map(c,
            c.?envFrom.orValue([]).map(e, e.?secretRef.?name.orValue('')) +
            c.?env.orValue([]).map(e, e.?valueFrom.?secretKeyRef.?name.orValue(''))).flatten()
        ).filter(n, n != '')
    - name: oldSecrets
      expression: >-
        (variables.oldPod.?volumes.orValue([]).map(v,
            [v.?secret.?secretName.orValue(''), v.?azureFile.?secretName.orValue(''),
             v.?csi.?nodePublishSecretRef.?name.orValue('')] +
            ['cephfs', 'rbd', 'flexVolume', 'iscsi', 'scaleIO', 'storageos'].map(t,
              v[?t].?secretRef.?name.orValue('')) +
            v.?projected.?sources.orValue([]).map(s, s.?secret.?name.orValue(''))).flatten() +
         variables.oldContainers.map(c,
            c.?envFrom.orValue([]).map(e, e.?secretRef.?name.orValue('')) +
            c.?env.orValue([]).map(e, e.?valueFrom.?secretKeyRef.?name.orValue(''))).flatten()
        ).filter(n, n != '')
    - name: addedSecrets
      expression: >-
        variables.newSecrets.filter(n,
          !(request.operation == 'UPDATE' && n in variables.oldSecrets) &&
          !variables.allowedSecrets.exists(p, (request.?namespace.orValue('') + '/' + n).matches(p)))
    # The param is the caller's own grant, and that grant allows these references.
    - name: ownGrant
      expression: params.metadata.name == variables.grantName
    - name: grantAllows
      expression: >-
        params.spec.type == 'kube' &&
        params.spec.?kube.?role.orValue('') == 'dev-env-grant-namespace-operator' &&
        params.?status.?phase.orValue('') == 'Active' &&
        request.?namespace.orValue('') in params.spec.?kube.?namespaces.orValue([]) &&
        variables.addedSecrets.all(n, n in params.spec.?kube.?secrets.orValue([]))
  validations:
    - expression: "size(variables.addedSecrets) == 0 || !variables.ownGrant || variables.grantAllows"
      messageExpression: >-
        'dev-env-grant-secret-names: ' + request.userInfo.username + ' may add a Secret reference only to a Secret ' +
        'its Active dev-env-grant-namespace-operator grant names, in a namespace it names; refused in ' +
        request.?namespace.orValue('') + ': ' + variables.addedSecrets.join(', ') + ' (DESIGN-042 5.1)'
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: dev-env-grant-secret-names
spec:
  policyName: dev-env-grant-secret-names
  validationActions: [Deny]
  paramRef:
    namespace: dev-agents
    selector: {}
    parameterNotFoundAction: Allow
