---
# PROPOSAL, not a copy: thaynes43/dev-env DESIGN-042 5.1 (P5, the new VAP). This file is
# NOT in haynes-ops yet. It is what P5 would add as
# kubernetes/main/apps/dev-env-system/rbac/app/grant-secret-names.yaml. The broker's
# envtest suite (namespace_operator_envtest_test.go) proves it on the 1.35 API server.
# When P5 lands, copy the haynes-ops version into ../haynes-ops/ and delete this one.
# The 16 indexed checks below differ only in their index.
#
# dev-env-grant-secret-names: a grant identity (dev-agents/grant-<id>) may add a Secret
# reference to a pod spec only when the authorizer says it may `use` that Secret, by
# name, in the request's namespace. Only a namespace-operator grant holds such a `use`:
# the broker gives its ServiceAccount a Role and RoleBinding, <grant>-secret-use, in
# each namespace the grant names, allowing `use` on exactly the grant's Secrets
# (resourceNames). So the check fails closed:
#   - without the caller's own secret-use binding, nothing is allowed;
#   - another grant's Role or binding never helps: RBAC binds it to that grant's
#     ServiceAccount alone;
#   - there are no params, so a missing, stale or unsynced param cannot open it;
#   - revoking a grant deletes its secret-use binding and Role first, before its
#     catalog binding and its ServiceAccount, so an ended grant authorizes nothing.
#
# An earlier draft took every AccessGrant as a param (paramRef selector {}). That fails
# open: the API server evaluates the policy once per param and refuses only if one
# evaluation fails, so a caller whose own grant was missing from the params, or a
# cluster with only unrelated grants, was allowed. A paramRef cannot select a param by
# the requesting identity: its name, namespace and selector are fixed in the binding.
#
# What counts as a reference is dev-env-identity-guard's own list, plus cinder. A
# reference is added when its Secret is newly visible to the containers (env, envFrom,
# a secret or projected volume) or newly referenced at all (also a volume source the
# kubelet alone uses, such as csi.nodePublishSecretRef). So moving a Secret from a
# kubelet-only source into the containers needs a `use`. An UPDATE that adds no
# reference (kubectl rollout restart, an image change) is not refused here. Residual:
# widening a reference to the same Secret, such as one secretKeyRef key to a whole
# envFrom, is not an added reference.
#
# The short list is dev-env-identity-guard's: keep them equal.
#
# Expiry. Release or expiry deletes the grant's RoleBindings and ServiceAccount, so a new
# API call fails at once. Three things outlive it, and this policy bounds the first:
#   - a Job or Pod already created runs on. So a grant identity's Job or Pod must set
#     activeDeadlineSeconds, at most 3600 (1h), on create, and an update may not lift or
#     raise it. The grant's own TTL is not visible here (no params), so the cap is a
#     fixed hour, DESIGN-042's longest TTL for the namespace operator. It holds for
#     every grant identity's Job and Pod, an app operator's (C1) too;
#   - an exec stream already open is authorized only at connect, and runs until it
#     closes;
#   - a Secret value already printed or copied cannot be recalled.
#
# Cost: each authorizer check costs 350000 of an expression's 1000000, so the checks are
# one per expression, for reference 0 to 15, and a request may add at most 16 references
# (a Secret referenced twice counts twice). Requests from grant identities only.
#
# failurePolicy Fail: the match condition is a string compare that cannot fail, so an
# error refuses only a grant identity's pod-bearing request.
#
# It is the second of P5's two guard deltas. The first, in dev-env-identity-guard rule 4,
# leaves a grant identity's added references to this policy and caps
# activeDeadlineSeconds and ttlSecondsAfterFinished at 3600; it keeps refusing them for
# dev-env-agent. P4 gives the broker what the secret-use objects need: create, get and
# delete on Roles, the custom verb `use` on secrets (no read, so it may grant it), and
# broker-guard entries for Roles and RoleBindings named <grant>-secret-use whose one rule
# is `use` on named secrets, bound to the grant's own ServiceAccount.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: dev-env-grant-secret-names
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources: [pods, replicationcontrollers]
      - apiGroups: [apps]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources: [deployments, statefulsets, daemonsets, replicasets]
      - apiGroups: [batch]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources: [jobs, cronjobs]
  matchConditions:
    - name: grant-identity
      expression: request.userInfo.username.startsWith('system:serviceaccount:dev-agents:grant-')
  variables:
    # dev-env-identity-guard's short list: keep it equal.
    - name: allowedSecrets
      expression: "['^[a-z0-9-]+/[a-z0-9-]+-volsync-aws-secret$']"
    - name: ns
      expression: request.?namespace.orValue('')
    - name: resource
      expression: request.resource.resource
    - name: newPod
      expression: >-
        variables.resource == 'pods' ? object.spec :
        variables.resource == 'cronjobs' ? object.spec.jobTemplate.spec.template.spec :
        object.spec.?template.?spec.orValue({})
    - name: oldPod
      expression: >-
        variables.resource == 'pods' ? oldObject.spec :
        variables.resource == 'cronjobs' ? oldObject.spec.jobTemplate.spec.template.spec :
        oldObject.spec.?template.?spec.orValue({})
    - name: newContainers
      expression: >-
        variables.newPod.?containers.orValue([]) + variables.newPod.?initContainers.orValue([]) +
        variables.newPod.?ephemeralContainers.orValue([])
    - name: oldContainers
      expression: >-
        variables.oldPod.?containers.orValue([]) + variables.oldPod.?initContainers.orValue([]) +
        variables.oldPod.?ephemeralContainers.orValue([])
    # Secrets the containers see.
    - name: newVisible
      expression: >-
        (variables.newPod.?volumes.orValue([]).map(v,
            [v.?secret.?secretName.orValue('')] +
            v.?projected.?sources.orValue([]).map(s, s.?secret.?name.orValue(''))).flatten() +
         variables.newContainers.map(c,
            c.?envFrom.orValue([]).map(e, e.?secretRef.?name.orValue('')) +
            c.?env.orValue([]).map(e, e.?valueFrom.?secretKeyRef.?name.orValue(''))).flatten()
        ).filter(n, n != '')
    - name: oldVisible
      expression: >-
        (variables.oldPod.?volumes.orValue([]).map(v,
            [v.?secret.?secretName.orValue('')] +
            v.?projected.?sources.orValue([]).map(s, s.?secret.?name.orValue(''))).flatten() +
         variables.oldContainers.map(c,
            c.?envFrom.orValue([]).map(e, e.?secretRef.?name.orValue('')) +
            c.?env.orValue([]).map(e, e.?valueFrom.?secretKeyRef.?name.orValue(''))).flatten()
        ).filter(n, n != '')
    # Secrets only the kubelet uses, to mount a volume.
    - name: newMount
      expression: >-
        variables.newPod.?volumes.orValue([]).map(v,
            [v.?azureFile.?secretName.orValue(''), v.?csi.?nodePublishSecretRef.?name.orValue('')] +
            ['cephfs', 'cinder', 'rbd', 'flexVolume', 'iscsi', 'scaleIO', 'storageos'].map(t,
              v[?t].?secretRef.?name.orValue(''))).flatten().filter(n, n != '')
    - name: oldMount
      expression: >-
        variables.oldPod.?volumes.orValue([]).map(v,
            [v.?azureFile.?secretName.orValue(''), v.?csi.?nodePublishSecretRef.?name.orValue('')] +
            ['cephfs', 'cinder', 'rbd', 'flexVolume', 'iscsi', 'scaleIO', 'storageos'].map(t,
              v[?t].?secretRef.?name.orValue(''))).flatten().filter(n, n != '')
    # Added: newly visible to the containers, or newly referenced at all; the short list
    # excepted.
    - name: added
      expression: >-
        (variables.newVisible.filter(n, !(request.operation == 'UPDATE' && n in variables.oldVisible)) +
         variables.newMount.filter(n, !(request.operation == 'UPDATE' &&
           (n in variables.oldVisible || n in variables.oldMount)))
        ).filter(n, !variables.allowedSecrets.exists(p, (variables.ns + '/' + n).matches(p)))
  validations:
    - expression: >-
        !(variables.resource in ['jobs', 'pods']) ||
        (request.operation == 'UPDATE' && object.spec.?activeDeadlineSeconds == oldObject.spec.?activeDeadlineSeconds) ||
        (object.spec.?activeDeadlineSeconds.orValue(0) > 0 && object.spec.activeDeadlineSeconds <= 3600)
      messageExpression: >-
        'dev-env-grant-secret-names: a ' + variables.resource.substring(0, size(variables.resource) - 1) + ' that ' +
        request.userInfo.username + ' creates sets spec.activeDeadlineSeconds, at most 3600: release and expiry do not stop ' +
        'a running pod (DESIGN-042 5.1)'
      reason: Forbidden
    - expression: size(variables.added) <= 16
      messageExpression: >-
        'dev-env-grant-secret-names: ' + request.userInfo.username + ' may add at most 16 Secret references in one request, not ' +
        string(size(variables.added)) + ' (DESIGN-042 5.1)'
      reason: Forbidden
    - expression: >-
        size(variables.added) <= 0 ||
        authorizer.group('').resource('secrets').namespace(variables.ns).name(variables.added[0]).check('use').allowed()
      messageExpression: >-
        'dev-env-grant-secret-names: ' + request.userInfo.username + ' may not use Secret ' + variables.added[0] +
        ' in ' + variables.ns + ': no grant of this identity names it there (DESIGN-042 5.1)'
      reason: Forbidden
    - expression: >-
        size(variables.added) <= 1 ||
        authorizer.group('').resource('secrets').namespace(variables.ns).name(variables.added[1]).check('use').allowed()
      messageExpression: >-
        'dev-env-grant-secret-names: ' + request.userInfo.username + ' may not use Secret ' + variables.added[1] +
        ' in ' + variables.ns + ': no grant of this identity names it there (DESIGN-042 5.1)'
      reason: Forbidden
    - expression: >-
        size(variables.added) <= 2 ||
        authorizer.group('').resource('secrets').namespace(variables.ns).name(variables.added[2]).check('use').allowed()
      messageExpression: >-
        'dev-env-grant-secret-names: ' + request.userInfo.username + ' may not use Secret ' + variables.added[2] +
        ' in ' + variables.ns + ': no grant of this identity names it there (DESIGN-042 5.1)'
      reason: Forbidden
    - expression: >-
        size(variables.added) <= 3 ||
        authorizer.group('').resource('secrets').namespace(variables.ns).name(variables.added[3]).check('use').allowed()
      messageExpression: >-
        'dev-env-grant-secret-names: ' + request.userInfo.username + ' may not use Secret ' + variables.added[3] +
        ' in ' + variables.ns + ': no grant of this identity names it there (DESIGN-042 5.1)'
      reason: Forbidden
    - expression: >-
        size(variables.added) <= 4 ||
        authorizer.group('').resource('secrets').namespace(variables.ns).name(variables.added[4]).check('use').allowed()
      messageExpression: >-
        'dev-env-grant-secret-names: ' + request.userInfo.username + ' may not use Secret ' + variables.added[4] +
        ' in ' + variables.ns + ': no grant of this identity names it there (DESIGN-042 5.1)'
      reason: Forbidden
    - expression: >-
        size(variables.added) <= 5 ||
        authorizer.group('').resource('secrets').namespace(variables.ns).name(variables.added[5]).check('use').allowed()
      messageExpression: >-
        'dev-env-grant-secret-names: ' + request.userInfo.username + ' may not use Secret ' + variables.added[5] +
        ' in ' + variables.ns + ': no grant of this identity names it there (DESIGN-042 5.1)'
      reason: Forbidden
    - expression: >-
        size(variables.added) <= 6 ||
        authorizer.group('').resource('secrets').namespace(variables.ns).name(variables.added[6]).check('use').allowed()
      messageExpression: >-
        'dev-env-grant-secret-names: ' + request.userInfo.username + ' may not use Secret ' + variables.added[6] +
        ' in ' + variables.ns + ': no grant of this identity names it there (DESIGN-042 5.1)'
      reason: Forbidden
    - expression: >-
        size(variables.added) <= 7 ||
        authorizer.group('').resource('secrets').namespace(variables.ns).name(variables.added[7]).check('use').allowed()
      messageExpression: >-
        'dev-env-grant-secret-names: ' + request.userInfo.username + ' may not use Secret ' + variables.added[7] +
        ' in ' + variables.ns + ': no grant of this identity names it there (DESIGN-042 5.1)'
      reason: Forbidden
    - expression: >-
        size(variables.added) <= 8 ||
        authorizer.group('').resource('secrets').namespace(variables.ns).name(variables.added[8]).check('use').allowed()
      messageExpression: >-
        'dev-env-grant-secret-names: ' + request.userInfo.username + ' may not use Secret ' + variables.added[8] +
        ' in ' + variables.ns + ': no grant of this identity names it there (DESIGN-042 5.1)'
      reason: Forbidden
    - expression: >-
        size(variables.added) <= 9 ||
        authorizer.group('').resource('secrets').namespace(variables.ns).name(variables.added[9]).check('use').allowed()
      messageExpression: >-
        'dev-env-grant-secret-names: ' + request.userInfo.username + ' may not use Secret ' + variables.added[9] +
        ' in ' + variables.ns + ': no grant of this identity names it there (DESIGN-042 5.1)'
      reason: Forbidden
    - expression: >-
        size(variables.added) <= 10 ||
        authorizer.group('').resource('secrets').namespace(variables.ns).name(variables.added[10]).check('use').allowed()
      messageExpression: >-
        'dev-env-grant-secret-names: ' + request.userInfo.username + ' may not use Secret ' + variables.added[10] +
        ' in ' + variables.ns + ': no grant of this identity names it there (DESIGN-042 5.1)'
      reason: Forbidden
    - expression: >-
        size(variables.added) <= 11 ||
        authorizer.group('').resource('secrets').namespace(variables.ns).name(variables.added[11]).check('use').allowed()
      messageExpression: >-
        'dev-env-grant-secret-names: ' + request.userInfo.username + ' may not use Secret ' + variables.added[11] +
        ' in ' + variables.ns + ': no grant of this identity names it there (DESIGN-042 5.1)'
      reason: Forbidden
    - expression: >-
        size(variables.added) <= 12 ||
        authorizer.group('').resource('secrets').namespace(variables.ns).name(variables.added[12]).check('use').allowed()
      messageExpression: >-
        'dev-env-grant-secret-names: ' + request.userInfo.username + ' may not use Secret ' + variables.added[12] +
        ' in ' + variables.ns + ': no grant of this identity names it there (DESIGN-042 5.1)'
      reason: Forbidden
    - expression: >-
        size(variables.added) <= 13 ||
        authorizer.group('').resource('secrets').namespace(variables.ns).name(variables.added[13]).check('use').allowed()
      messageExpression: >-
        'dev-env-grant-secret-names: ' + request.userInfo.username + ' may not use Secret ' + variables.added[13] +
        ' in ' + variables.ns + ': no grant of this identity names it there (DESIGN-042 5.1)'
      reason: Forbidden
    - expression: >-
        size(variables.added) <= 14 ||
        authorizer.group('').resource('secrets').namespace(variables.ns).name(variables.added[14]).check('use').allowed()
      messageExpression: >-
        'dev-env-grant-secret-names: ' + request.userInfo.username + ' may not use Secret ' + variables.added[14] +
