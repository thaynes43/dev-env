---
# dev-env-home-expiry-guard: the HOME expiry's owner override is set by a
# person, never by code (thaynes43/dev-env DESIGN-025 section 9, ADR-005). The
# annotation dev-env.haynesops.com/home-expiry on an AgentSession holds an
# expiry (hold) or skips its grace (release-now). This policy refuses a request
# that adds, changes or removes it to every system: identity: every
# ServiceAccount (the operator, the broker, the keeper, Flux and every agent),
# and the control-plane and node identities. dev-env-identity-guard already
# refuses every dev-agents identity any write to dev-env.haynesops.com objects;
# this one covers the rest. Human users are outside it: Tom acts as himself with
# kubectl. Before H7 ships it, list the users and groups that can update
# AgentSessions; if anyone but Tom is among them, match on Tom's identity
# instead (refuse every user but him). And check which identity Tom's phone path
# uses: if it is a ServiceAccount, exempt that one account in the
# matchCondition below. Both in the reviewed haynes-ops change.
#
# This is the reference copy the dev-env envtest suite runs
# (internal/controller TestHomeExpiryOverrideGuardIsOwnerOnly); haynes-ops ships
# it in H7 under kubernetes/main/apps/dev-env-system/rbac/app/.
#
# A status update cannot change metadata, so only the main resource is matched.
# Failure: Fail, matched by username first (a string compare that cannot fail).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: dev-env-home-expiry-guard
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [dev-env.haynesops.com]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources: [agentsessions]
  matchConditions:
    - name: system-identity
      expression: request.userInfo.username.startsWith('system:')
  variables:
    - name: present
      expression: >-
        has(object.metadata.annotations) &&
        'dev-env.haynesops.com/home-expiry' in object.metadata.annotations
    - name: before
      expression: >-
        request.operation == 'UPDATE' && has(oldObject.metadata.annotations) &&
        'dev-env.haynesops.com/home-expiry' in oldObject.metadata.annotations
  validations:
    - expression: >-
        (!variables.present && !variables.before) ||
        (variables.present && variables.before &&
          object.metadata.annotations['dev-env.haynesops.com/home-expiry'] ==
          oldObject.metadata.annotations['dev-env.haynesops.com/home-expiry'])
      message: no ServiceAccount or other system identity sets, changes or removes the HOME expiry override dev-env.haynesops.com/home-expiry (DESIGN-025 9); its owner does
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: dev-env-home-expiry-guard
spec:
  policyName: dev-env-home-expiry-guard
  validationActions: [Deny]
