name: CI

# The required check is the aggregate job "CI - Success" (and only that one).
# No `paths:` filter on the trigger: a docs-only PR must still get "CI - Success",
# or a required check would wait forever. Jobs filter themselves instead.
#
# Every job runs the Makefile's own targets, so a developer or an agent in the
# shared dev-env pod runs exactly what CI runs. The Makefile caps parallelism at 2
# (GO_PARALLELISM). Actions minutes on a private repo are a budget: no matrices, no
# repeated suites, and the Go module and build caches (setup-go) plus the pinned
# tools in bin/tools/ (actions/cache) are restored for every job.
#
# Image builds run on PRs only and never push. publish.yml publishes the operator
# image from main (B3); publish-agent.yml publishes the agent image from a release tag
# (B5).
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# One run per ref. A new push to a PR cancels the superseded run; main runs finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Only the agent-image job reads this, and that job runs on PRs only. On push the
  # action would need a git fetch with credentials, which persist-credentials: false
  # removes, so it is skipped there.
  changes:
    name: Changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # paths-filter lists a PR's files through the API, which a private repo
    # answers only with this scope ("Resource not accessible by integration").
    permissions:
      contents: read
      pull-requests: read
    outputs:
      agent_image: ${{ steps.filter.outputs.agent_image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            agent_image:
              - 'images/agent/**'

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Cache golangci-lint
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin/tools/golangci-lint-*
          key: golangci-lint-${{ runner.os }}-${{ hashFiles('Makefile') }}
      - name: golangci-lint
        run: make lint

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # setup-envtest and the kube-apiserver, etcd and kubectl it downloads for
      # the envtest suites (internal/testenv). The Makefile pins both versions.
      - name: Cache setup-envtest and the envtest binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            bin/tools/setup-envtest-*
            bin/tools/envtest
          key: envtest-${{ runner.os }}-${{ hashFiles('Makefile') }}
      # Unit tests and the envtest suites, two packages at a time (Makefile).
      - name: go test -p 2
        run: make test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build every binary for linux/amd64
        run: make build
      - name: Build agent-run for darwin/arm64
        run: make build-agent-run-darwin

  # Stale generated code (deep-copy, CRDs) fails here. A separate job so the lint
  # and test jobs do not wait on controller-gen.
  check-generated:
    name: Check generated code
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Cache controller-gen
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin/tools/controller-gen-*
          key: controller-gen-${{ runner.os }}-${{ hashFiles('Makefile') }}
      - name: make check-generated
        run: make check-generated

  # Build only, never push. No .git in the build context, so COMMIT is passed.
  image-operator:
    name: Image (operator)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the operator image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./images/operator/Dockerfile
          push: false
          build-args: |
            COMMIT=${{ github.event.pull_request.head.sha }}
          cache-from: type=gha,scope=dev-env-operator
          cache-to: type=gha,mode=max,scope=dev-env-operator

  # Only when images/agent/** changes (the Dockerfile, its tools, the smoke test). ~3 GB
  # image: CI only, never in the pod. Builds, loads and smoke-tests it; never pushes
  # (publish-agent.yml pushes from a release tag). The `commit` here is the PR head, so
  # the smoke test also proves COMMIT reaches agentd. Changes to the Go code alone do
  # not trigger this job: the operator image job builds the same Go sources, and a
  # Go-only break reaches the agent image only through `make build`, which `build` runs.
  image-agent:
    name: Image (agent)
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.agent_image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the agent image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./images/agent/Dockerfile
          push: false
          load: true
          tags: dev-env-agent:ci
          build-args: |
            COMMIT=${{ github.event.pull_request.head.sha }}
          cache-from: type=gha,scope=dev-env-agent
          cache-to: type=gha,mode=max,scope=dev-env-agent
      - name: Smoke-test the agent image
        timeout-minutes: 5
        run: images/agent/smoke-test.sh dev-env-agent:ci "${{ github.event.pull_request.head.sha }}"
      - name: Report the image size
        run: |
          size="$(docker image inspect --format '{{.Size}}' dev-env-agent:ci)"
          echo "Agent image: $((size / 1024 / 1024)) MiB uncompressed (${size} bytes)" | tee -a "$GITHUB_STEP_SUMMARY"

  # The one required check. Skipped jobs (the image jobs on push, the agent image
  # when it did not change) are fine; failed or cancelled ones are not.
  success:
    name: CI - Success
    if: always()
    needs:
      - changes
      - lint
      - test
      - build
      - check-generated
      - image-operator
      - image-agent
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any job failed or was cancelled
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "${NEEDS}" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "${NEEDS}" | jq -e '[.[].result] | any(. == "failure" or . == "cancelled")' >/dev/null; then
            echo "A job failed or was cancelled." >&2
            exit 1
          fi
