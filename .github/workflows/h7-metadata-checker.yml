name: H7 metadata checker

on:
  pull_request:
    paths:
      - tools/h7-metadata-checker/**
      - .github/workflows/h7-metadata-checker.yml
  push:
    branches: [main]
    paths:
      - tools/h7-metadata-checker/**
      - .github/workflows/h7-metadata-checker.yml

permissions:
  contents: read

concurrency:
  group: h7-metadata-checker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  offline-checker:
    name: H7 offline checker and Mac binaries
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      GOMAXPROCS: '2'
      GOTOOLCHAIN: local
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache-dependency-path: |
            tools/h7-metadata-checker/celhelper/go.sum
            tools/h7-metadata-checker/transport/go.sum
      - name: CEL grammar fixtures and binaries
        working-directory: tools/h7-metadata-checker/celhelper
        run: |
          mkdir -p "$RUNNER_TEMP/h7-checker"
          nice -n 19 go test -mod=readonly -p 1 -parallel 1 -count 1 -timeout 2m ./...
          nice -n 19 go build -mod=readonly -trimpath -o "$RUNNER_TEMP/h7-checker/cel-linux-amd64" .
          nice -n 19 env GOOS=darwin GOARCH=arm64 go build -mod=readonly -trimpath -o "$RUNNER_TEMP/h7-checker/cel-darwin-arm64" .
      - name: Unchanged Mac transport offline fixtures and binary
        working-directory: tools/h7-metadata-checker/transport
        run: |
          nice -n 19 go test -mod=readonly -p 1 -parallel 1 -count 1 -timeout 2m ./...
          nice -n 19 env GOOS=darwin GOARCH=arm64 go build -mod=readonly -trimpath -o "$RUNNER_TEMP/h7-checker/get-darwin-arm64" .
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0; pinned haynes-ops convention
        with:
          python-version: '3.15'
      - name: Python3.12 checker and real CEL integration fixtures
        run: |
          python3 --version
          nice -n 19 python3 -I -B tools/h7-metadata-checker/test_checker.py --cel-helper "$RUNNER_TEMP/h7-checker/cel-linux-amd64"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
      - name: Python3.9 checker and real CEL integration fixtures
        run: |
          python3 --version
          nice -n 19 python3 -I -B tools/h7-metadata-checker/test_checker.py --cel-helper "$RUNNER_TEMP/h7-checker/cel-linux-amd64"
      - name: Exact source and binary provenance
        run: |
          go version -m "$RUNNER_TEMP/h7-checker/cel-darwin-arm64" > "$RUNNER_TEMP/h7-checker/cel-buildinfo.txt"
          go version -m "$RUNNER_TEMP/h7-checker/get-darwin-arm64" > "$RUNNER_TEMP/h7-checker/get-buildinfo.txt"
          python3 -I -B tools/h7-metadata-checker/artifact_manifest.py "$RUNNER_TEMP/h7-checker"
          git diff --exit-code
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2; pinned haynes-ops convention
        with:
          name: h7-metadata-checker-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/h7-checker
          if-no-files-found: error
          retention-days: 7
