name: Claude Code Review

# Advisory automated PR review. NOT a required check and never to be added to
# branch rules. Fires on opened/synchronize/ready_for_review/reopened (the set
# `track_progress` supports) because agents open PRs ready-for-review and merge
# themselves once required checks are green.
#
# Safe by construction: plain `pull_request` only (never pull_request_target),
# so fork PRs get no secrets and skip; the job also skips drafts and bot-authored
# dependency PRs, and finishes green when CLAUDE_CODE_OAUTH_TOKEN is not set.
#
# Source: haynes-ops .agents/templates/github/claude-code-review.yml, set up per
# haynes-ops .agents/runbooks/new-repo-setup.md. Actions are SHA-pinned in the
# haynes-ops style (this repo publishes signed images; Renovate keeps the pins fresh).
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read

# Re-review on every push, but only the newest push per PR.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-advisory-review:
    name: Claude advisory review
    if: >-
      ${{ !github.event.pull_request.draft
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'
      && github.event.pull_request.user.login != 'renovate[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write # post the review + inline comments
      id-token: write # OIDC exchange for the Claude GitHub App token
      actions: read # read CI results for the PR

    steps:
      # Secrets cannot appear in `if:`, so expose presence as a step output.
      - name: Check for CLAUDE_CODE_OAUTH_TOKEN
        id: gate
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLAUDE_CODE_OAUTH_TOKEN is not set for this repo; skipping the Claude review."
          fi

      - name: Checkout repository
        if: steps.gate.outputs.present == 'true'
        # Keep the default credential persistence: claude-code-action runs `git fetch origin
        # <pr-branch>` before it sets up its own git auth, and this private repo refuses that
        # without a credential. Do NOT add `persist-credentials: false`.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run Claude Code Review
        if: steps.gate.outputs.present == 'true'
        uses: anthropics/claude-code-action@cab360f6565aa35a51d6ce9e43f1f4287c0a32ea # v1.0.241
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "haynes-dev-bot"
          track_progress: true
          use_sticky_comment: true
          # Automated surfaces pin the newest Opus explicitly, never an alias.
          # The Bash and inline-comment grants are needed for `gh` and line
          # comments; without them the review only ever leaves a summary.
          claude_args: |
            --model claude-opus-5-5
            --max-turns 60
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*)"
          additional_permissions: |
            actions: read
          prompt: |
            You are the automated reviewer for thaynes43/dev-env: dev-env v2, the
            distributed in-cluster development environment for AI coding agents in
            Tom's home lab. It holds the design docs (saga, ADRs, designs), and as it
            is built: a Kubernetes operator with an HTTP API, the `agent-run` CLI that
            calls it, the agent container image (ghcr.io/thaynes43/dev-env), and their
            CI. The deploy manifests live in a different repo (thaynes43/haynes-ops,
            GitOps via Flux), not here.
            The PR branch is checked out. Review PR #${{ github.event.pull_request.number }}
            of ${{ github.repository }}.

            ## Step 1 - context
            - `gh pr diff ${{ github.event.pull_request.number }}` for the changes
            - `gh pr view ${{ github.event.pull_request.number }}` for intent
            - Read CLAUDE.md, and for design changes the saga README, ADRs and design
              under `.agents/sagas/` that the changed files belong to.
            - Do not repeat feedback already present on the PR.

            ## Step 2 - what this repo cares about
            Layout: `.agents/sagas/<saga>/` (README with decision log, `adrs/`,
            `designs/`, `backlog/` plans), `.github/workflows/`; code directories
            (operator, CLI, image) arrive with the build phases and are named in
            CLAUDE.md when they do.

            **CRITICAL - block the merge**
            - Secrets or PII in code, docs, fixtures, logs or workflow files. In this
              repo that includes Claude Max credentials (`.credentials.json`
              contents, OAuth login URLs with `code_challenge`/`state`, pasted login
              codes), `CLAUDE_CODE_OAUTH_TOKEN` values, Codex `auth.json` contents,
              GitHub App private keys or minted `ghs_` tokens, 1Password field
              values, SSH keys, and the Unraid/Proxmox tokens the agent pods use.
            - Anything that lets an operator upgrade or restart delete or restart
              running agent pods: owner references from agent pods or their volumes
              to the operator's Deployment, cascading finalizers, CRD removal paths
              without `prune: disabled`-style protection.
            - Deleting an agent session's volume or worktree without the rescue step
              first (uncommitted and unpushed work must be preserved before reap).
            - RBAC broader than the design's tiers: agent pods above today's OPERATOR
              tier (no secrets read, no RBAC or node mutation); the operator writing
              pods or PVCs outside its own agent namespace; any agent-reachable path
              that returns a refresh token or other long-lived credential.
            - Agent pods without CPU and memory limits, or scheduled onto the
              control-plane nodes; tests, CI or scripts that run busy loops or
              unbounded parallelism (a dev-env pod with no CPU limit starved a
              control-plane node on 2026-10-05).
            - Concurrent use of one rotating OAuth refresh token (Claude Max login,
              Codex auth.json) from more than one process or pod; proven to revoke
              the whole token family.
            - Logic errors: races, unhandled null/undefined, off-by-one, changed
              signatures with callers not updated.
            - Image builds that publish from pull requests, skip cosign keyless
              signing, or use unpinned base images or tools.
            - Workflow changes that weaken security: `pull_request_target`,
              `allowed_non_write_users`, secrets exposed to fork PRs, broadened permissions.

            **HIGH - should fix**
            - Docs-first: a behavior or interface change with no matching update to
              the saga design or ADR. An Accepted ADR is immutable; changes need a
              new ADR that supersedes it. An answered Q-NN must be folded back in as
              a ruling with its date.
            - Model ids written as aliases (`opus`, `sonnet`, `fable`) instead of full
              ids such as `claude-opus-5-5`.
            - Tool versions in a Dockerfile without a `# renovate:` annotation, or a
              version number placed between that annotation and its ARG.
            - Boot-path scripts that can block or exit non-zero (the v1 boot path must
              stay fast and never fatal; slow work belongs after readiness).
            - Behavior change with no test change where the code has tests.

            **MEDIUM - consider**
            - Docs that are hard to read: long sentences, unexplained jargon, stale
              cross-references to files, PRs or Q-NN ids that do not exist.
            - Mermaid diagrams that would not render.

            **Ignore entirely:** formatting, naming, import order, missing docstrings
            on unchanged code, and feature suggestions beyond the PR's intent.

            ## Step 3 - report
            - Post each line-specific finding with
              `mcp__github_inline_comment__create_inline_comment` (`confirmed: true`),
              prefixing the body with its severity: `CRITICAL:`, `HIGH:` or `MEDIUM:`.
              Be concise: one or two sentences, the problem and the fix.
            - Then post ONE summary comment with `gh pr comment` containing a verdict
              (`Looks good` / `Needs changes` / `Has critical issues`) and the findings
              grouped by severity, each naming the file and line. No praise.
            - If the diff is clean, say exactly "No findings." followed by one sentence
              on what you checked. Never invent a finding to look thorough.
            - Only review files changed in this PR. Post GitHub comments only; do not
              return the review as chat text.
