name: Portal session PostgreSQL

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portal-postgres-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  postgres:
    name: Portal PostgreSQL integration
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
        env:
          POSTGRES_PASSWORD: synthetic-ci-admin-only
          POSTGRES_DB: dev_env_v2_portal
        ports:
          - 5432:5432
          - 5433:5433
        options: >-
          --cpus 2 --memory 512m
          --health-cmd "pg_isready -U postgres -d dev_env_v2_portal"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Enable disposable verified TLS and role-scoped HBA
        env:
          PORTAL_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          umask 077
          mkdir "$RUNNER_TEMP/portal-tls"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj /CN=localhost -addext subjectAltName=DNS:localhost \
            -keyout "$RUNNER_TEMP/portal-tls/server.key" \
            -out "$RUNNER_TEMP/portal-tls/server.crt" >/dev/null 2>&1
          docker cp "$RUNNER_TEMP/portal-tls" "$PORTAL_POSTGRES_CONTAINER:/tmp/portal-tls"
          docker exec -u root "$PORTAL_POSTGRES_CONTAINER" sh -eu -c '
            cp /tmp/portal-tls/server.crt "$PGDATA/server.crt"
            cp /tmp/portal-tls/server.key "$PGDATA/server.key"
            chown postgres:postgres "$PGDATA/server.crt" "$PGDATA/server.key"
            chmod 600 "$PGDATA/server.key"
            printf "\nssl = on\n" >> "$PGDATA/postgresql.conf"
            {
              printf "host replication postgres 127.0.0.1/32 scram-sha-256\n"
              printf "hostssl dev_env_v2_portal dev_env_v2_portal_runtime all scram-sha-256\n"
              printf "host all dev_env_v2_portal_runtime all reject\n"
              printf "local all dev_env_v2_portal_runtime reject\n"
              cat "$PGDATA/pg_hba.conf"
            } > "$PGDATA/portal-hba.conf"
            chown postgres:postgres "$PGDATA/portal-hba.conf"
            mv "$PGDATA/portal-hba.conf" "$PGDATA/pg_hba.conf"
          '
          docker exec "$PORTAL_POSTGRES_CONTAINER" psql -U postgres -d dev_env_v2_portal -qAtc 'SELECT pg_reload_conf()' >/dev/null
      - name: Focused actual PostgreSQL and authorization tests
        env:
          GOTOOLCHAIN: local
          GOMAXPROCS: '2'
          PORTAL_REQUIRE_DISPOSABLE_PROOF: "1"
          PORTAL_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          export PORTAL_TEST_DATABASE_URL="postgres://postgres:synthetic-ci-admin-only@localhost:5432/dev_env_v2_portal?sslmode=verify-full&sslrootcert=$RUNNER_TEMP/portal-tls/server.crt"
          nice -n 19 go test -race -p 1 -count=1 -v ./web/portal/session
          git diff --exit-code
      - name: Remove disposable private TLS material
        if: always()
        run: rm -rf "$RUNNER_TEMP/portal-tls"
