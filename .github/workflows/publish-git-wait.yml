name: Publish Git wait fixture

# Explicit dispatch from reviewed main only. Publication never launches a trial.
# Existing dev-env package, separate immutable diagnostic tag; no v1/release tag.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-git-wait
  cancel-in-progress: false

jobs:
  fixture:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/dev-env
      IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/publish-git-wait.yml@refs/heads/main
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set immutable fixture tag
        id: meta
        run: echo "tag=git-wait-sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: Refuse uncertain existing-tag lookup
        id: existing
        env:
          REF: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
        run: |
          if digest="$(docker buildx imagetools inspect "${REF}" --format '{{.Manifest.Digest}}' 2>err.txt)"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          elif grep -qiE 'not found|404' err.txt; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            cat err.txt >&2
            exit 1
          fi
      - name: Build fixture under low-parallel native recipe
        if: steps.existing.outputs.exists != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./images/git-wait/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          build-args: |
            COMMIT=${{ github.sha }}
      - name: Check finite ABI and tiny equivalence before push
        if: steps.existing.outputs.exists != 'true'
        timeout-minutes: 3
        env:
          REF: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          TRIAL_HELPER_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          helper_sha="$(sha256sum scripts/trials/workspace-cephfs-trial.py)"
          helper_sha="${helper_sha%% *}"
          docker run --rm --cpus=2 --memory=512m --pids-limit=64 --ulimit core=0 \
            --network=none --read-only --tmpfs /tmp:rw,mode=1777,size=64m \
            --env TRIAL_HELPER_SOURCE_COMMIT --env TRIAL_HELPER_SHA256="${helper_sha}" \
            --entrypoint /usr/bin/nice "${REF}" \
            -n 19 python3 /opt/dev-env/trials/checks/check-git-wait-image.py
      - name: Push checked fixture
        if: steps.existing.outputs.exists != 'true'
        id: push
        env:
          REF: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
        run: |
          docker push "${REF}"
          digest="$(docker inspect --format='{{index .RepoDigests 0}}' "${REF}")"
          echo "digest=${digest#*@}" >> "$GITHUB_OUTPUT"
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Sign and verify exact fixture digest
        env:
          DIGEST: ${{ steps.push.outputs.digest || steps.existing.outputs.digest }}
          EXISTS: ${{ steps.existing.outputs.exists }}
        run: |
          test -n "${DIGEST}"
          # An existing unsigned tag has uncertain build provenance; never grant
          # it this workflow's identity merely because its name matches main.
          if [ "${EXISTS}" != true ]; then
            cosign sign --yes "${IMAGE}@${DIGEST}"
          fi
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity "${IDENTITY}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null
          echo "Fixture: ${IMAGE}:${{ steps.meta.outputs.tag }}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
