name: Publish

# Publishes the operator image, ghcr.io/thaynes43/dev-env-operator, from main and
# signs it. (B3, .agents/sagas/distributed-dev-env/KICKOFF.md section 3.) The agent
# image has its own workflow, publish-agent.yml, which runs from a release tag (B5, D-53).
#
# Tags: only sha-<short>. Never `latest`, and an existing tag is never pushed again.
# A run for a commit whose tag already exists (a manual re-run) skips the build, so
# the digest never changes under a tag. The push trigger has a paths filter, so a
# docs-only or workflow-only merge builds no image at all. Together these avoid what
# v1 (haynes-ops dev-env-build.yml) suffered: rebuilds from unchanged source that
# re-tagged an image with a new digest and made Renovate open digest-drift PRs.
# Release tags (the repo's single version, both images) arrive with release-please
# in B4.
#
# Triggers: push to main that changes an input of the image build, and
# workflow_dispatch for a manual run on main. Dispatch ignores the paths filter: it
# builds the current commit if its tag is missing (this is how the first publish, and
# any publish after an edit to this file, is run: `gh workflow run publish.yml`). On
# a commit already published it builds nothing and only signs the image if no valid
# signature exists, which is the way to retry a run whose signing step failed. Like
# v1, this workflow does not list its own file in the paths, so a workflow edit never
# rebuilds; run it by hand after deliberately changing it.
#
# After signing, a verify step checks the pushed digest against this workflow's
# identity, on every run, so a mis-signed image fails the job.
#
# Signing matches haynes-ops v1 exactly (cosign-installer v4.1.2 with cosign v3.1.3,
# `cosign sign --yes <image>@<digest>`, keyless), so Kyverno sees v2 images the same
# way it sees v1's. cosign v3 writes only the Sigstore bundle (an OCI referrer, which
# GHCR stores under the tag sha256-<digest>), while Kyverno's verifyImages Cosign
# attestor reads the legacy sha256-<digest>.sig tag. So the cluster's
# verify-thaynes43-images policy reports "no signatures found" for v1 images today,
# and it will for these. That is harmless while the policy is Audit. When
# thaynes43/haynes-ops#3092 is resolved, follow it here: if it pins cosign v2 in the
# v1 workflows, set cosign-release to the same version below; if it moves Kyverno to
# a bundle-aware verifier, nothing changes here. The Kyverno rule must also list this
# image and this workflow's identity before it is enforced; that is a haynes-ops
# change (plan 01, "In haynes-ops").
on:
  push:
    branches:
      - main
    # Everything the operator image build reads (images/operator/Dockerfile runs
    # `make build` on a COPY of the whole repo). Add a path here when a new input
    # appears, for example an embedded directory.
    paths:
      - 'images/operator/**'
      - 'cmd/**'
      - 'internal/**'
      - 'api/**'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - '.dockerignore'
  workflow_dispatch:

permissions:
  contents: read

# Publishes never overlap and never cancel one in flight: a half-pushed image or a
# missing signature is worse than waiting. GitHub keeps one pending run per group, so
# of several quick merges the oldest run and the newest run publish; an intermediate
# commit may never get an image. Deploys pin the commit they want, not every commit.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  operator:
    name: Publish (operator)
    # workflow_dispatch can be started on any branch; only main publishes.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The only job with write access to packages and an OIDC token.
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing: proves the image came from THIS workflow
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/dev-env-operator
      # The keyless signing identity: this workflow, on main. Used to sign-check and verify.
      IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/publish.yml@refs/heads/main
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and tags, so `git describe` can name the build.
          fetch-depth: 0
          persist-credentials: false

      - name: Compute the tag and version
        id: meta
        run: |
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          # Empty before the first release tag; the binaries then report "dev" with
          # the commit stamped. The Makefile uses the same pattern.
          echo "version=$(git describe --tags --match 'v[0-9]*' 2>/dev/null || true)" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # The same pin as haynes-ops dev-env-build.yml. See the header comment and
          # thaynes43/haynes-ops#3092 before changing it.
          cosign-release: v3.1.3

      # An existing tag is final. Its digest is read back so that a signing retry
      # signs exactly what is there.
      - name: Check whether the tag exists
        id: existing
        env:
          REF: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
        run: |
          if digest="$(docker buildx imagetools inspect "${REF}" --format '{{.Manifest.Digest}}' 2>err.txt)"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "digest=${digest}" >> "$GITHUB_OUTPUT"
            echo "${REF} already exists (${digest}); not rebuilding it."
          elif grep -qiE 'not found|404' err.txt; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "${REF} does not exist yet."
          else
            # Auth, network or registry trouble: do not guess and risk a re-push.
            cat err.txt >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        if: steps.existing.outputs.exists != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # provenance and sbom are off so the pushed digest is one plain image manifest,
      # as v1's `docker push` produced, and not an index with attestation manifests.
      - name: Build and push the operator image
        id: build
        if: steps.existing.outputs.exists != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./images/operator/Dockerfile
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          build-args: |
            COMMIT=${{ github.sha }}
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=dev-env-operator
          cache-to: type=gha,mode=max,scope=dev-env-operator

      - name: Sign the image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest || steps.existing.outputs.digest }}
          EXISTS: ${{ steps.existing.outputs.exists }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          test -n "${DIGEST}"
          echo "Image: ${IMAGE}:${TAG}@${DIGEST}"
          # An existing tag may already be signed (the usual case) or may have lost
          # its signing step to a failed run. Sign it only in the second case.
          if [ "${EXISTS}" = "true" ] && cosign verify "${IMAGE}@${DIGEST}" \
              --certificate-identity "${IDENTITY}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null; then
            echo "Already signed by ${IDENTITY}."
            exit 0
          fi
          cosign sign --yes "${IMAGE}@${DIGEST}"
          echo "Signed ${IMAGE}@${DIGEST}"

      # Runs on both paths (fresh build and existing tag), after signing or after the
      # "already signed" check, so every run ends with a verified image: a mis-signed
      # or unsigned digest fails the run. The identity is pinned to this repo's publish
      # workflow on refs/heads/main, exactly. Kyverno differs: haynes-ops'
      # verify-thaynes43-images policy matches subject
      # https://github.com/thaynes43/haynes-ops/.github/workflows/* (a wildcard over
      # haynes-ops workflows, no ref pin). For v2 images it would need a second
      # keyless entry with subject
      # https://github.com/thaynes43/dev-env/.github/workflows/publish.yml@refs/heads/main
      # (haynes-ops change, see the header). The package is public (Q-13), but this
      # reads it with the job's login from the step above, which a private one needs.
      - name: Verify the signature
        env:
          DIGEST: ${{ steps.build.outputs.digest || steps.existing.outputs.digest }}
        run: |
          test -n "${DIGEST}"
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity "${IDENTITY}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null
          echo "Verified ${IMAGE}@${DIGEST} signed by ${IDENTITY}"
