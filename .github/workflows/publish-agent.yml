name: Publish agent image

# Publishes the v2 agent image, ghcr.io/thaynes43/dev-env:2.x.y, from a release tag and
# signs it. (B5, .agents/sagas/distributed-dev-env/KICKOFF.md section 3; decision D-53.)
# The operator image is published by publish.yml from main.
#
# Why a tag and not main: the image's tag IS the repo's release version (DESIGN-001
# section 10), and the version is known only once release-please has cut `vX.Y.Z`.
# A push to main knows a commit, not a version, and this image never gets a `sha-` tag
# or `latest`. So the trigger is a push of a `v2.x.y` tag, and the image tag is that
# tag without the `v`. Consequences for the keyless signature: its identity ends in
# `@refs/tags/v2.x.y`, not `@refs/heads/main`, so haynes-ops' Kyverno rule
# verify-dev-env-v2 must trust this workflow on `refs/tags/v2.*` (paired haynes-ops PR).
#
# Triggers:
#  * push of a tag matching v2.<n>.<n>. A tag that release-please creates with the
#    workflow's GITHUB_TOKEN starts no workflow (GitHub suppresses it), which is what
#    release-please.yml does until the release App secret exists. Then run it by hand
#    on the tag: `gh workflow run publish-agent.yml --ref v2.0.0`.
#  * workflow_dispatch on a tag ref, for exactly that case and for a signing retry. On
#    a branch the job is skipped, so a dispatch cannot publish from a branch.
# The tagged commit must be reachable from main, so a tag pushed from a side branch
# publishes nothing.
#
# Never `latest`, and never an existing tag again (the v1 "toolchain trap": a rebuild
# from unchanged source gives a new digest under the same tag and Renovate opens
# digest-drift PRs). A run for a tag that already exists skips the build, and only signs
# the image if no valid signature is there. v1's 0.6.x tags and `latest` in the same
# package are never touched.
#
# The image is built and loaded, smoke-tested (images/agent/smoke-test.sh, the same
# script CI runs on PRs), and only then pushed, so what ships is what passed. It is
# built without a cache: this workflow runs once per release, and a cold build is
# worth more than another ~1 GB in the repo's Actions cache quota.
#
# Needs: the `thaynes43/dev-env` repo has Write on the existing GHCR package
# `ghcr.io/thaynes43/dev-env` (package settings, "Manage Actions access"; it was
# created by haynes-ops' workflow). Without it the push fails with 403.
#
# Signing matches publish.yml and haynes-ops v1 (cosign v3.1.3, keyless); see
# publish.yml's header for the Kyverno `.sig` tag caveat (haynes-ops#3092).
on:
  push:
    tags:
      - 'v2.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-agent
  cancel-in-progress: false

jobs:
  agent:
    name: Publish (agent)
    # Tag refs only; a dispatch from a branch is skipped.
    if: startsWith(github.ref, 'refs/tags/v2.')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The only job with write access to packages and an OIDC token.
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing: proves the image came from THIS workflow
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/dev-env
      # The keyless signing identity: this workflow, on this tag.
      IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/publish-agent.yml@${{ github.ref }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, so the tagged commit can be checked against main.
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag and compute the image tag
        id: meta
        run: |
          if ! [[ "${GITHUB_REF_NAME}" =~ ^v2\.[0-9]+\.[0-9]+$ ]]; then
            echo "${GITHUB_REF_NAME} is not a v2.x.y release tag." >&2
            exit 1
          fi
          # Only commits that are on main are published; a tag on a side branch is not.
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" FETCH_HEAD; then
            echo "${GITHUB_SHA} (tag ${GITHUB_REF_NAME}) is not reachable from main; not publishing." >&2
            exit 1
          fi
          echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # The same pin as publish.yml and haynes-ops dev-env-build.yml.
          cosign-release: v3.1.3

      # An existing tag is final. Its digest is read back so that a signing retry signs
      # exactly what is there.
      - name: Check whether the tag exists
        id: existing
        env:
          REF: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
        run: |
          if digest="$(docker buildx imagetools inspect "${REF}" --format '{{.Manifest.Digest}}' 2>err.txt)"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "digest=${digest}" >> "$GITHUB_OUTPUT"
            echo "${REF} already exists (${digest}); not rebuilding it."
          elif grep -qiE 'not found|404' err.txt; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "${REF} does not exist yet."
          else
            # Auth, network or registry trouble: do not guess and risk a re-push.
            cat err.txt >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        if: steps.existing.outputs.exists != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # provenance and sbom are off so the pushed digest is one plain image manifest,
      # as v1's `docker push` produced, and not an index with attestation manifests.
      - name: Build the agent image
        if: steps.existing.outputs.exists != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./images/agent/Dockerfile
          push: false
          load: true
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          build-args: |
            COMMIT=${{ github.sha }}
            VERSION=${{ steps.meta.outputs.version }}

      - name: Smoke-test the agent image
        if: steps.existing.outputs.exists != 'true'
        timeout-minutes: 5
        run: images/agent/smoke-test.sh "${IMAGE}:${{ steps.meta.outputs.tag }}" "${GITHUB_SHA}"

      - name: Push the validated image
        id: push
        if: steps.existing.outputs.exists != 'true'
        env:
          REF: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
        run: |
          docker push "${REF}"
          digest="$(docker inspect --format='{{index .RepoDigests 0}}' "${REF}")"
          echo "digest=${digest#*@}" >> "$GITHUB_OUTPUT"

      - name: Sign the image (keyless)
        env:
          DIGEST: ${{ steps.push.outputs.digest || steps.existing.outputs.digest }}
          EXISTS: ${{ steps.existing.outputs.exists }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          test -n "${DIGEST}"
          echo "Image: ${IMAGE}:${TAG}@${DIGEST}"
          # An existing tag may already be signed (the usual case) or may have lost its
          # signing step to a failed run. Sign it only in the second case.
          if [ "${EXISTS}" = "true" ] && cosign verify "${IMAGE}@${DIGEST}" \
              --certificate-identity "${IDENTITY}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null; then
            echo "Already signed by ${IDENTITY}."
            exit 0
          fi
          cosign sign --yes "${IMAGE}@${DIGEST}"
          echo "Signed ${IMAGE}@${DIGEST}"

      # Runs on both paths, after signing or after the "already signed" check, so every
      # run ends with a verified image. The identity is pinned to this workflow on this
      # exact tag. The digest is printed in the job summary: haynes-ops pins
      # `dev-env:<tag>@<digest>` in dev-env-templates.
      - name: Verify the signature
        env:
          DIGEST: ${{ steps.push.outputs.digest || steps.existing.outputs.digest }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          test -n "${DIGEST}"
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity "${IDENTITY}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null
          echo "Verified ${IMAGE}@${DIGEST} signed by ${IDENTITY}"
          echo "Pin: \`${IMAGE}:${TAG}@${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"
