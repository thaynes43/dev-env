name: H7 native continuation diagnostic

on:
  pull_request:
    paths:
      - internal/agentd/native_invocation_test.go
      - .github/workflows/h7-native-continuation-diagnostic.yml
  push:
    branches: [main]
    paths:
      - internal/agentd/native_invocation_test.go
      - .github/workflows/h7-native-continuation-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnostic:
    name: Exact native continuation diagnostic
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GOMAXPROCS: '2'
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - name: Avoid repeating the optional diagnostic for documentation-only commits
        id: source
        run: |
          if git diff --quiet HEAD^ HEAD -- internal/agentd; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
          else
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.source.outputs.run == 'true'
        with:
          go-version-file: go.mod
      - name: Record exact source and toolchain
        if: steps.source.outputs.run == 'true'
        run: |
          git rev-parse HEAD
          go version
      - name: One exact synthetic continuation test
        if: steps.source.outputs.run == 'true'
        run: nice -n 19 go test -p 1 -parallel 1 -count 1 -timeout 3m -run '^TestNativeInvocationOwnedWaitAllowsOneSameWriterContinuation$' -v ./internal/agentd
