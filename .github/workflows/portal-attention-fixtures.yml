name: Portal Attention fixtures

on:
  pull_request:
    paths:
      - scripts/trials/portal_attention/**
      - .github/workflows/portal-attention-fixtures.yml
  push:
    branches: [main]
    paths:
      - scripts/trials/portal_attention/**
      - .github/workflows/portal-attention-fixtures.yml

permissions:
  contents: read

concurrency:
  group: portal-attention-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  offline-preview:
    name: Portal offline presentation fixtures
    runs-on: ubuntu-26.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Finite synthetic tests and inert preview
        run: |
          python3 --version
          nice -n 19 python3 -B -m unittest discover -s scripts/trials/portal_attention -p 'test_*.py' -v
          nice -n 19 python3 -B scripts/trials/portal_attention/preview.py --output "$RUNNER_TEMP/portal-attention/preview.html"
          git rev-parse HEAD > "$RUNNER_TEMP/portal-attention/source-head.txt"
          (
            cd "$RUNNER_TEMP/portal-attention"
            sha256sum preview.html > preview.sha256
          )
          portal_source_status="$(git status --porcelain=v1 --untracked-files=all)"
          test -z "$portal_source_status"
      # preview.sha256 supports portable reproduction; upload-artifact's digest
      # is the integrity reference for the uploaded archive, not that checksum.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portal-attention-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/portal-attention
          if-no-files-found: error
          retention-days: 7
